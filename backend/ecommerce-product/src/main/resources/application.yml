server:
  port: 8082
  servlet:
    context-path: /product

spring:
  application:
    name: ecommerce-product
  servlet:
    multipart:
      # 与 oss.max-size-mb 保持一致，避免大文件在进入业务层前被容器拒绝
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://192.168.178.100:3306/qoder_fullstack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.178.100
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    # Elasticsearch 配置（默认禁用，设置 enabled=true 启用）
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://192.168.178.100:9200
    enabled: true
    username:
    password:
  # RabbitMQ 配置
  rabbitmq:
    host: 192.168.178.100
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.178.100:8848

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.product.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置：与网关、用户服务共用同一签名密钥（开启身份头签名校验时必须一致）
jwt:
  secret: ${JWT_SECRET:qoder-fullstack-jwt-secret-key-change-me-in-production-2026}

# 身份头信任边界：网关已向下游注入 X-User-Id / X-User-Name / X-User-Role 及 HMAC 签名头
security:
  trusted-header:
    # false：保留本地直连 8082 调试能力（开发环境已知取舍）
    # true：只接受带合法网关签名的请求，容器化/对外部署必须开启，并配合网络隔离
    verify-signature: ${TRUSTED_HEADER_VERIFY_SIGNATURE:false}
    max-age-seconds: 300

# 阿里云 OSS 配置：AK/SK 仅通过环境变量注入，未配置时应用仍可启动（上传接口返回 503）
oss:
  enabled: ${OSS_ENABLED:true}
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  bucket: ${OSS_BUCKET:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # 对象 Key 前缀，形如 product/2026/11/18/xxx.png
  dir: ${OSS_DIR:product}
  # 留空则使用 https://{bucket}.{endpoint}；配置 CDN/自定义域名时填写完整前缀
  public-url-prefix: ${OSS_PUBLIC_URL_PREFIX:}
  max-size-mb: 5
  allowed-types: image/jpeg,image/png,image/webp,image/gif
  # 本地兜底存储：AK/SK 未配置时图片写入该目录，由 /files/local/** 静态映射对外提供
  # 返回的 URL 为相对路径（经网关 /api/product/files/local 白名单读取），无需硬编码主机端口
  local-dir: ${OSS_LOCAL_DIR:uploads}
  local-url-prefix: ${OSS_LOCAL_URL_PREFIX:/api/product/files/local}

logging:
  level:
    # 默认 INFO，本地需要详细日志时用 APP_LOG_LEVEL=DEBUG 开启
    com.ecommerce.product: ${APP_LOG_LEVEL:INFO}

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    title: 商品服务 API
    version: OPENAPI_3_0
    description: 商品 CRUD、ES 搜索、秒杀库存管理等接口
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
