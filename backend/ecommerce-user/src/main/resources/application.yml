server:
  port: 8081
  servlet:
    # User service context path: gateway routes /api/user/** here, stripping /api prefix
    context-path: /user

spring:
  application:
    name: ecommerce-user
  datasource:
    # MySQL 连接配置：本地开发前请先按 README「数据库初始化」小节创建 qoder_fullstack 库并执行 db/schema.sql
    url: jdbc:mysql://192.168.178.100:3306/qoder_fullstack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 占位示例值，本地开发请替换为自己的 MySQL 密码，不要将真实密码提交到仓库
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置：用于存储用户会话Token，实现单设备登录（互踢/挤下线）机制
  data:
    redis:
      host: 192.168.178.100
      port: 6379
      password:  # 无密码
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  devtools:
    restart:
      # 默认关闭自动重启，本地需要热重载时用 DEVTOOLS_RESTART=true 开启（避免容器/生产环境吃内存）
      enabled: ${DEVTOOLS_RESTART:false}
      # 监控 classpath 变更自动重启
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: ${DEVTOOLS_LIVERELOAD:false}
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.178.100:8848

# MyBatis 配置：SQL 统一写在 classpath:mapper/*.xml；
# map-underscore-to-camel-case 作为兜底，用户表下划线字段主要依赖 UserMapper.xml 中的 resultMap 显式映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.user.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置：secret 用于 HS256 签名，长度必须 >= 32 字节；expiration-minutes 为 Token 有效期（分钟）
# 同一份密钥网关与三个业务服务必须一致，生产通过环境变量 JWT_SECRET 注入
jwt:
  secret: ${JWT_SECRET:qoder-fullstack-jwt-secret-key-change-me-in-production-2026}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# 身份头信任边界：网关已向下游注入 X-User-Id / X-User-Name / X-User-Role 及 HMAC 签名头
security:
  trusted-header:
    # false：保留本地直连 8081 调试能力（开发环境已知取舍）
    # true：只接受带合法网关签名的请求，容器化/对外部署必须开启，并配合网络隔离
    verify-signature: ${TRUSTED_HEADER_VERIFY_SIGNATURE:false}
    max-age-seconds: 300

# 跨域配置：CORS 已收敛到网关单层处理，仅当浏览器需要直接跨域访问 8081 时开启
cors:
  direct-access:
    enabled: ${CORS_DIRECT_ACCESS_ENABLED:false}

# 图片验证码配置：
# - enabled=false 时跳过生成/校验（便于本地调试或自动化测试临时关闭该功能）
# - expire-seconds 为验证码有效期（秒），过期后需重新获取；登录/注册校验成功后立即失效（一次性使用）；
#   发送短信时只校验内容、不校验有效期且不消耗，便于用户沿用同一张验证码完成登录/注册
# - width/height/code-length/line-count 控制图片尺寸、字符个数与干扰线数量
captcha:
  enabled: true
  expire-seconds: 120
  width: 130
  height: 44
  code-length: 4
  line-count: 15

# 登录行为开关
auth:
  # admin 演示账号免验证码；真实部署必须置 false（AUTH_SKIP_CAPTCHA_FOR_ADMIN=false）
  skip-captcha-for-admin: ${AUTH_SKIP_CAPTCHA_FOR_ADMIN:true}

# 云片网短信配置：
# - enabled=false 时不调用真实云片网接口，仅打印日志（默认关闭，避免演示环境误发短信 / 泄露真实密钥）
# - account-sid / api-key 需到云片网控制台获取后填入，仓库中保留占位符，不要提交真实密钥
# - timeout-ms 为连接/读取超时时间（毫秒）
# - max-retry / retry-interval-ms / retry-backoff 控制网络异常、超时或 5xx 可恢复错误的重试策略
#   retry-backoff: linear（重试间隔 = retry-interval-ms * 第几次重试）或 exponential（重试间隔 = retry-interval-ms * 2^(第几次重试-1)）
# - rate-limit-seconds 为同一手机号发送频率限制窗口（秒），窗口内不允许重复发送
# - code-expire-seconds 为短信验证码有效期（秒），与图片验证码过期配置（captcha.expire-seconds）分开独立配置
sms:
  enabled: false
  api-url: https://sms.yunpian.com/v2/sms/tpl_send.json
  account-sid: your_yunpian_account_sid
  api-key: your_yunpian_api_key
  template-id: "0"
  timeout-ms: 5000
  max-retry: 3
  retry-interval-ms: 1000
  retry-backoff: linear
  rate-limit-seconds: 60
  code-expire-seconds: 300

logging:
  level:
    # 默认 INFO，本地需要详细日志时用 APP_LOG_LEVEL=DEBUG 开启
    com.ecommerce.user: ${APP_LOG_LEVEL:INFO}

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    title: 用户服务 API
    description: 用户注册、登录、用户管理、验证码、短信等接口
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
