server:
  # 服务端口（本机 8080 被 Windows 系统进程占用，默认使用 8081；如需更换端口，请同步修改 frontend/vite.config.ts 的代理 target）
  port: 8081
  servlet:
    # 上下文路径：所有接口统一以 /api 开头，与前端代理配置保持一致
    context-path: /api

spring:
  application:
    name: demo-backend
  devtools:
    restart:
      enabled: true
      # 监控 classpath 变更自动重启
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true

# JWT 配置：secret 用于 HS256 签名，长度必须 >= 32 字节；expiration-minutes 为 Token 有效期（分钟）
jwt:
  secret: demo-fullstack-jwt-secret-key-change-me-in-production-2026
  expiration-minutes: 120
