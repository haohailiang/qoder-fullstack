server:
  port: 8083
  servlet:
    context-path: /order

spring:
  application:
    name: ecommerce-order
  datasource:
    url: jdbc:mysql://192.168.178.100:3306/qoder_fullstack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.178.100
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  # RabbitMQ 配置
  rabbitmq:
    host: 192.168.178.100
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        # AUTO：监听方法正常返回后由容器 ack，抛异常则重试 max-attempts 次后进死信队列
        # （此前为 manual，但消费者未持有 Channel/deliveryTag 也就从未 ack，导致消息常驻 unacked）
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.178.100:8848

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.order.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置（网关与用户服务共用同一签名密钥）
jwt:
  secret: ${JWT_SECRET:qoder-fullstack-jwt-secret-key-change-me-in-production-2026}

# 身份头信任边界：网关已向下游注入 X-User-Id / X-User-Name / X-User-Role 及 HMAC 签名头
security:
  trusted-header:
    # false：保留本地直连 8083 调试能力（开发环境已知取舍）
    # true：只接受带合法网关签名的请求，容器化/对外部署必须开启，并配合网络隔离
    verify-signature: ${TRUSTED_HEADER_VERIFY_SIGNATURE:false}
    max-age-seconds: 300

# 支付宝沙箱支付配置
# 所有密钥一律通过环境变量注入，禁止写入仓库；未配置时服务仍可正常启动，
# 创建支付接口会返回业务码 503（支付宝支付未配置）。
alipay:
  app-id: ${ALIPAY_APP_ID:}
  # 应用私钥（PKCS8）：支持单行 Base64、含 \n 转义、或带 PEM 头尾的完整内容
  private-key: ${ALIPAY_PRIVATE_KEY:}
  # 支付宝公钥（沙箱控制台「支付宝公钥」，非应用公钥）
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # 异步通知地址：必须是支付宝服务器可达的公网地址（内网穿透 / 公网网关）
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 支付完成后的同步回跳地址（本站支付结果页）
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/order/pay-result}
  sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
  charset: UTF-8
  # 订单支付超时时间，超时后支付宝侧交易关闭（TRADE_CLOSED）
  timeout-express: ${ALIPAY_TIMEOUT_EXPRESS:30m}

# OpenFeign 配置
spring.cloud.openfeign:
  client:
    config:
      ecommerce-product:
        connect-timeout: 5000
        read-timeout: 10000

logging:
  level:
    # 默认 INFO，本地需要详细日志时用 APP_LOG_LEVEL=DEBUG 覆盖
    com.ecommerce.order: ${APP_LOG_LEVEL:INFO}

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    title: 订单服务 API
    version: OPENAPI_3_0
    description: 订单创建、查询、取消、支付宝沙箱支付（创建支付 / 异步通知 / 主动查询）等接口
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
